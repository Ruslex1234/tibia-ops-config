<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tibia Ops Config - Guild Explorer</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Guild Explorer</h1>
            <p class="subtitle">Browse guild members by world</p>
            <nav class="page-nav">
                <a class="nav-button" href="dashboard.html">DevSecOps Dashboard &rarr;</a>
                <a href="https://github.com/Ruslex1234/tibia-ops-config">View on GitHub</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Selection Controls -->
        <section class="card">
            <h2>Find Members</h2>
            <div class="explorer-controls">
                <div class="control-group">
                    <label for="world-select">World</label>
                    <select id="world-select" disabled>
                        <option value="">Loading worlds...</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="guild-select">Guild</label>
                    <select id="guild-select" disabled>
                        <option value="">Select a world first</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="member-search">Filter members</label>
                    <input type="search" id="member-search" placeholder="Type a character name..." disabled autocomplete="off">
                </div>
            </div>

            <div class="explorer-stats">
                <div class="stat-chip">
                    <span class="stat-chip-value" id="stat-worlds">--</span>
                    <span class="stat-chip-label">Worlds</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-chip-value" id="stat-guilds">--</span>
                    <span class="stat-chip-label">Guilds in world</span>
                </div>
                <div class="stat-chip">
                    <span class="stat-chip-value" id="stat-members">--</span>
                    <span class="stat-chip-label">Members shown</span>
                </div>
            </div>
        </section>

        <!-- Results -->
        <section class="card">
            <h2 id="results-heading">Members</h2>
            <p class="explorer-status" id="results-status">Loading guild data...</p>
            <div class="member-grid" id="member-grid"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>
                Source: <code>.configs/world_guilds_data.json</code>
                <span id="data-timestamp"></span>
            </p>
            <p>Built with DevSecOps best practices | <a href="https://github.com/Ruslex1234/tibia-ops-config">View on GitHub</a></p>
        </div>
    </footer>

    <script src="assets/js/guilds.js"></script>
</body>
</html>
